# Tuned for a ~7GB-RAM / 12-core machine. Two crashes have come from memory, not
# from the heap being too small:
#   -Xmx8G   → exceeded total system RAM, native OOM ("failed to map ... bytes")
#   -Xmx2G   → daemon reached 3.2GB commit charge and the SYSTEM ran out of commit
#              (189MB free RAM, 35MB free page file); the C2 JIT thread died with a
#              native malloc failure while dexing (arena.cpp:191).
# So the budget below caps the daemon's *total* footprint, not just the heap:
#   Xmx1792m           live set after GC is ~1GB, so this leaves real headroom
#   MaxMetaspaceSize   in-process Kotlin pushes metaspace to ~500MB; 768m caps the
#                      reserve without starving it
#   ReservedCodeCache  192m is plenty for a build JVM
#   UseSerialGC        G1 spawns ~10 GC worker threads on 12 cores, each with its
#                      own native structures — serial GC gives that memory back
#   CICompilerCount=2  fewer JIT compiler threads; this is the exact allocation
#                      that failed last time
org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC -XX:CICompilerCount=2 -XX:+HeapDumpOnOutOfMemoryError

# Fewer concurrent forked workers — each one is another JVM competing for commit.
org.gradle.workers.max=2
org.gradle.parallel=false
# Build cache OFF: on Windows it failed to pack task outputs
# ("Could not get file mode for ... classes/io") and broke the build. It is a
# speed optimisation only, so it goes rather than the build.
org.gradle.caching=false

android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=false
# Keeps Kotlin compilation inside the daemon instead of forking a second JVM. It
# costs ~500MB of metaspace that stays resident through dexing; if the daemon
# still dies here, switching this to "daemon" plus
# kotlin.daemon.jvmargs=-Xmx512m moves that cost out of the crashing process.
kotlin.compiler.execution.strategy=in-process


# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
